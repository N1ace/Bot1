# ------------------------------------------------------------------
# cryptobot configuration. Secrets do NOT go here - they go in .env
# See binance-futures-bot-reference.md for the decisions behind these values.
# ------------------------------------------------------------------

# Which trading module to run.
#   futures         - USDⓈ-M perpetual futures (current focus)
#   spot            - parked (read-only startup check works)
#   margin, copytrade_lead - later
mode: futures

# Where orders would go.
#   futures: demo (Binance Demo Trading, fake money) | live
#   spot:    paper | testnet | live
#   live = REAL MONEY. Also requires live_trading: true AND the
#   CRYPTOBOT_CONFIRM_LIVE environment variable. See CLAUDE.md.
environment: demo
live_trading: false

# Where prices come from.
#   exchange - the same environment as orders (demo prices on demo).
#              Recommended for futures: demo prices track the real market and
#              they are the prices your demo orders fill at.
#   live     - real Binance market data (read-only, no key).
market_data: exchange

# Which API key set to use. Keys are read from .env as
#   BINANCE_<ACCOUNT>_<ENVIRONMENT>_API_KEY + _PRIVATE_KEY / _PRIVATE_KEY_PATH / _API_SECRET
# e.g. account FUTURES + environment demo -> BINANCE_FUTURES_DEMO_API_KEY
account: FUTURES

quote_currency: USDT
pairs:                   # futures symbols (no slash)
  - BTCUSDT
  - ETHUSDT
timeframe: 1h
candle_limit: 100

futures:
  leverage: 2            # default 2x; the code refuses anything above 3x
  margin_type: ISOLATED  # only ISOLATED is allowed

risk:
  max_order_value: 100         # max value of ONE order (position size), in USDT.
                               # BTCUSDT's minimum order is 50 USDT (demo), so one
                               # minimum-size BTC order is ~56 USDT.
  max_open_positions: 2        # max number of symbols held at the same time
  max_daily_loss: 30           # USDT; when today's loss reaches this, stop opening trades
  require_stop_loss: true      # every entry must come with a stop-loss price

paper:
  starting_balances:
    USDT: 1000

logging:
  level: INFO                  # DEBUG for more detail
  dir: logs

storage:
  sqlite_path: data/cryptobot.sqlite

telegram:
  enabled: false               # stub only for now; token/chat id go in .env
