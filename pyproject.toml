[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptobot"
version = "0.1.0"
description = "Modular Binance trading bot (spot first, margin/futures later)"
requires-python = ">=3.11"
# Dependencies are pinned in requirements.txt; install that first.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
